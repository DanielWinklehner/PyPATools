[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "PyPATools"
version = "1.0.0"
dependencies = []

# None of these are needed to import PyPATools. fast/gpu/openpmd/progress are
# guarded by try/except with a working fallback (or are function-level
# imports); space-charge is different -- poisson_amg.py imports pyamg and
# py_electrodes unguarded at module level, so that ONE module will not
# import without them. Nothing else in the package pulls it in.
[project.optional-dependencies]
# JIT acceleration. numba is imported in field.py, pusher.py, particles.py,
# field_src/interpolators.py and particles_src/distribution_generators.py,
# each behind a try/except that falls back to pure NumPy -- correct either
# way, dramatically slower without.
fast = ["numba"]

# openPMD I/O. Two SEPARATE packages, easily confused:
#   openpmd-api          -> `openpmd_api`, field meshes
#                           (field.py, field_src/openpmd_io.py)
#   openpmd-beamphysics  -> `beamphysics`, particle distributions
#                           (particles_src/particle_io.py). Note the import
#                           name is not `pmd_beamphysics`; that spelling is
#                           the deprecated alias.
openpmd = ["openpmd-api", "openpmd-beamphysics"]

# GPU backends for the interpolators, pusher and the PyAMG solver. If plain
# `cupy` tries to build from source, install the wheel matching your CUDA
# toolkit instead (e.g. cupy-cuda12x).
gpu = ["cupy"]

# Poisson / space-charge solver (poisson_amg.py). That module ALSO needs
# py_electrodes, which is not on PyPI -- install it separately from
# https://github.com/DanielWinklehner/py_electrodes
space-charge = ["pyamg"]

# Progress bars in trackers.py (guarded; falls back to no progress bar).
progress = ["tqdm"]

dev = ["pytest", "flake8"]

[tool.ruff]
# Kept in step with .flake8 -- flake8 cannot read pyproject.toml, so the
# same two settings have to be stated in both places. Change one, change
# the other.
line-length = 120

# Ruff already skips build/ by default and currently skips backup/ only
# because it honours .gitignore; naming both makes that independent of
# the ignore rules. Without them ruff reports ~158 errors from the old
# code parked in backup/.
extend-exclude = ["build", "backup"]

[tool.ruff.lint]
# Ruff's default selection is E4/E7/E9 + F, a strict subset of what
# flake8 checks -- it would pass code that .flake8 rejects. E + W + F
# lines the two up, and the tree is clean under it.
#
# Not exact even so: ruff implements E1/E2/E3 (indentation, whitespace,
# blank lines) only under --preview, so E301/E302/E303 are caught by
# flake8 but not by ruff. flake8 remains the authority.
select = ["E", "W", "F"]

[tool.setuptools.packages.find]
where = ["src"]
